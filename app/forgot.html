<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Realtime Messaging Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="forgot-container" class="auth-box">
        <h2>Reset Password</h2>
        <form id="forgot-form">
            <input type="text" id="forgot-username" placeholder="Enter your username" required autocomplete="off">
            <input type="email" id="forgot-email" placeholder="Enter your email address" required autocomplete="off">
            <input type="password" id="forgot-new-password" placeholder="Enter new secure password" required>
            <p style="font-size: 0.76rem; color: var(--text-muted); margin-top: -0.4rem; margin-bottom: 0.8rem; text-align: left; line-height: 1.3;">
                🔒 Must be at least 6 characters with 1 capital letter and 1 special character.
            </p>
            <button type="submit">Update Password</button>
        </form>
        <p class="toggle-text">Remembered password? <a href="/login">Back to Login</a></p>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim();
            const email = document.getElementById('forgot-email').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }
            if (!/[A-Z]/.test(newPassword)) {
                alert('Password must contain at least one uppercase letter (A-Z).');
                return;
            }
            if (!/[^A-Za-z0-9]/.test(newPassword)) {
                alert('Password must contain at least one special character (e.g. !@#$%^&*).');
                return;
            }

            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, newPassword })
            });

            if (res.ok) {
                alert('Password reset successful. Please log in with your new credentials.');
                window.location.href = '/login';
            } else {
                alert(await res.text());
            }
        });
    </script>
</body>
</html>
